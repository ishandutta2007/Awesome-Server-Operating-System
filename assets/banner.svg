<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="sphere-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-3deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dash-wave {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      
      .animated-bg-1 { animation: float-slow 8s ease-in-out infinite; }
      .animated-bg-2 { animation: float-reverse 10s ease-in-out infinite; }
      .pulsing-node { animation: pulse-glow 4s ease-in-out infinite; }
      .wave-line {
        stroke-dasharray: 20 10;
        animation: dash-wave 30s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="12" />

  <!-- Ambient Animated Background Lights (Behind content) -->
  <g filter="url(#blur-bg)">
    <circle cx="150" cy="80" r="120" fill="#0284c7" class="animated-bg-1" />
    <circle cx="1050" cy="240" r="140" fill="#6366f1" class="animated-bg-2" />
    <circle cx="900" cy="60" r="90" fill="#a855f7" class="animated-bg-1" />
  </g>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="320" fill="url(#grid)" />
  </g>

  <!-- Animated Dynamic Waves / Network Lines in Background -->
  <g stroke="url(#primary-glow)" stroke-width="1.5" fill="none" opacity="0.35">
    <path class="wave-line" d="M -50 220 Q 200 300 450 200 T 950 250 T 1250 180" />
    <path class="wave-line" d="M -50 100 Q 300 40 600 140 T 1100 80 T 1250 120" />
  </g>

  <!-- Abstract Floating Network Nodes (Background Dynamic Elements) -->
  <g opacity="0.5">
    <circle cx="100" cy="220" r="4" fill="#38bdf8" class="pulsing-node" />
    <line x1="100" y1="220" x2="180" y2="260" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <circle cx="180" cy="260" r="3" fill="#818cf8" />
    
    <circle cx="1080" cy="90" r="5" fill="#c084fc" class="pulsing-node" />
    <line x1="1080" y1="90" x2="1010" y2="140" stroke="#c084fc" stroke-width="1" opacity="0.4" />
    <circle cx="1010" cy="140" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Main Banner Header Box (Glassmorphic Container with Safe Foreground Padding) -->
  <rect x="60" y="40" width="1080" height="240" rx="16" fill="#161b22" fill-opacity="0.65" stroke="#30363d" stroke-width="1.5" />

  <!-- Accent Top Border Line -->
  <rect x="60" y="40" width="1080" height="4" rx="2" fill="url(#primary-glow)" />

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed Untouched & Crisp) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="1" filter="url(#glow)">
      🖥️ AWESOME SERVER OPERATING SYSTEM 🐧
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      The Enterprise Linux, BSD Distributions &amp; Cloud Infrastructure Matrix
    </text>

    <!-- Decorative Pill Badges in Foreground -->
    <g transform="translate(370, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="65" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Enterprise Linux</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="230" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">🔒 BSD Distributions</text>

      <!-- Pill 3 -->
      <rect x="330" y="0" width="130" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
      <text x="395" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">☁️ Cloud Native</text>
    </g>
  </g>
</svg>
